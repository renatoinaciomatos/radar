<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Dragão com Bússola e Filtro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .radar-case {
            width: 320px;
            height: 360px;
            background: radial-gradient(circle at 50% 30%, #f0f0f0 0%, #c0c0c0 70%, #8c8c8c 100%);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 -10px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 40px;
        }

        .radar-top-button {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 30px;
            background: linear-gradient(to right, #666, #999, #666);
            border-radius: 5px 5px 0 0;
            border-bottom: 4px solid #444;
        }

        .radar-screen {
            width: 260px;
            height: 260px;
            background-color: #224422;
            border: 12px solid #a0a0a0;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.3);
            touch-action: none; 
        }

        /* Elemento giratório controlado pela bússola */
        #compass-disk {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: center;
            transition: transform 0.1s ease-out;
        }

        .grid-lines {
            position: absolute;
            width: 140%;
            height: 140%;
            top: -20%;
            left: -20%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
            pointer-events: none;
        }

        .sweep {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: conic-gradient(from 0deg, rgba(0,255,0,0.15) 0deg, transparent 90deg);
            animation: rotate-sweep 4s linear infinite;
            pointer-events: none;
            transform-origin: center;
        }

        @keyframes rotate-sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .center-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: #00ff00;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #00ff00;
            z-index: 10;
        }

        #points-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .object-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #fff 0%, #ff8800 40%, #ff3300 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ff5500, 0 0 4px #ffaa00;
        }

        .object-dot.selected {
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 8px #ff5500;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(to bottom, #444, #222);
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .zoom-btn {
            font-size: 22px;
            padding: 6px 26px;
        }

        #collect-btn {
            background: linear-gradient(to bottom, #d9534f, #c9302c);
            border-color: #ac2925;
            text-transform: uppercase;
            font-size: 14px;
        }

        .info-panel {
            color: #88ff88;
            font-family: monospace;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            max-width: 300px;
            line-height: 1.4;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div class="radar-case">
        <div class="radar-top-button"></div>
        <div class="radar-screen" id="radar-screen">
            <!-- Disco interno que roda de acordo com a bússola -->
            <div id="compass-disk">
                <div class="grid-lines"></div>
                <div id="points-container"></div>
            </div>
            <div class="sweep"></div>
            <div class="center-marker"></div>
        </div>
    </div>

    <div class="controls">
        <button id="zoom-in-btn" class="zoom-btn">+</button>
        <button id="zoom-out-btn" class="zoom-btn">-</button>
        <button id="collect-btn">Coletar</button>
    </div>

    <div class="info-panel" id="info-panel">
        Buscando sinal estável de GPS...
    </div>
    <script>
        let currentPosition = null;
        let objectsList = JSON.parse(localStorage.getItem('radar_objects')) || [];
        
        // Definição exata do raio visível do radar em metros (Começa cobrindo 60m totais do centro até a borda)
        let radarRadiusInMeters = 60; 
        
        let selectedObjectId = null;
        let currentHeading = 0; // Graus da bússola

        // Variáveis do filtro básico de estabilização
        let lastRawLat = null;
        let lastRawLng = null;

        let pressTimer = null;

        const SCREEN = document.getElementById('radar-screen');
        const DISK = document.getElementById('compass-disk');
        const CONTAINER = document.getElementById('points-container');
        const INFO = document.getElementById('info-panel');

        function initSensors() {
            // 1. Inicializa Geolocalização com Filtro Antideriva
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lng = position.coords.longitude;

                        if (lastRawLat !== null && lastRawLng !== null) {
                            // Calcula quanto o sinal pulou desde o último segundo
                            let jumpDist = calculateDistance(lastRawLat, lastRawLng, lat, lng);
                            // Filtro de estabilidade: se o pulo for menor que 6 metros, assume-se que o usuário está parado
                            if (jumpDist < 6) {
                                lat = lastRawLat;
                                lng = lastRawLng;
                            }
                        }

                        lastRawLat = lat;
                        lastRawLng = lng;
                        currentPosition = { lat, lng };
                        updateRadar();
                    },
                    (error) => { INFO.innerText = "Ative o GPS de Alta Precisão."; },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            }

            // 2. Inicializa a Bússola (Magnetômetro do Smartphone)
            if (window.DeviceOrientationEvent) {
                // Suporte para iOS (requer pedido de permissão explícito)
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    SCREEN.addEventListener('click', () => {
                        DeviceOrientationEvent.requestPermission()
                            .then(response => {
                                if (response === 'granted') window.addEventListener('deviceorientation', handleOrientation, true);
                            });
                    }, { once: true });
                } else {
                    // Android e outros navegadores modernos
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            }
        }

        function handleOrientation(event) {
            // Captura a direção do norte magnético real do aparelho
            let heading = event.webkitCompassHeading || event.alpha;
            if (heading !== null && heading !== undefined) {
                // Inverte o ângulo para que os pontos rotacionem corretamente no visor
                currentHeading = 360 - heading;
                DISK.style.transform = `rotate(${currentHeading}deg)`;
            }
        }

        function updateRadar() {
            CONTAINER.innerHTML = '';
            if (!currentPosition) return;

            let statusText = `Raio Visível: ${radarRadiusInMeters} metros\nSegure a tela por 1s para marcar um item no seu local físico atual.`;
            
            if (selectedObjectId) {
                const currentObj = objectsList.find(obj => obj.id === selectedObjectId);
                if (currentObj) {
                    const distance = calculateDistance(currentPosition.lat, currentPosition.lng, currentObj.lat, currentObj.lng);
                    statusText += `\n\nAlvo Selecionado: ${currentObj.name}\nDistância: ${distance.toFixed(1)}m`;
                }
            }
            INFO.innerText = statusText;

            const screenRadiusPixels = SCREEN.clientWidth / 2;

            objectsList.forEach(obj => {
                // Converte a diferença geográfica direta para metros reais no mundo
                const metersY = (obj.lat - currentPosition.lat) * 111132; 
                const metersX = (obj.lng - currentPosition.lng) * (40075000 * Math.cos(currentPosition.lat * Math.PI / 180) / 360);

                // Calcula a distância direta em metros reais até o ponto
                const actualDistanceInMeters = Math.sqrt(metersX * metersX + metersY * metersY);

                // Se o objeto estiver dentro do raio máximo de visão configurado
                if (actualDistanceInMeters <= radarRadiusInMeters) {
                    // Regra de Proporção de Tela Baseada em Metros Exatos
                    const pixelX = screenRadiusPixels + (metersX / radarRadiusInMeters) * screenRadiusPixels;
                    const pixelY = screenRadiusPixels - (metersY / radarRadiusInMeters) * screenRadiusPixels;

                    const dot = document.createElement('div');
                    dot.className = 'object-dot';
                    if (selectedObjectId === obj.id) dot.classList.add('selected');
                    
                    dot.style.left = `${pixelX}px`;
                    dot.style.top = `${pixelY}px`;
                    
                    dot.addEventListener('touchstart', (e) => { e.stopPropagation(); selectObject(obj); });
                    dot.addEventListener('click', (e) => { e.stopPropagation(); selectObject(obj); });

                    CONTAINER.appendChild(dot);
                }
            });
        }

        function selectObject(obj) {
            selectedObjectId = obj.id;
            updateRadar();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function startPress(e) {
            if (!currentPosition) return;
            if (e.cancelable) e.preventDefault(); 

            pressTimer = setTimeout(() => {
                handleLongPress();
            }, 1000); 
        }

        function cancelPress() {
            if (pressTimer) clearTimeout(pressTimer);
        }

        function handleLongPress() {
            const objectName = prompt("Nome do objeto mapeado:");
            if (objectName && objectName.trim() !== "") {
                const newObject = {
                    id: Date.now(),
                    name: objectName.trim(),
                    lat: currentPosition.lat, 
                    lng: currentPosition.lng  
                };
                objectsList.push(newObject);
                localStorage.setItem('radar_objects', JSON.stringify(objectsList));
                selectedObjectId = newObject.id;
                updateRadar();
            }
        }

        // Modifica o raio total da tela em metros precisos ao apertar os botões
        document.getElementById('zoom-in-btn').addEventListener('click', () => {
            radarRadiusInMeters = Math.max(15, radarRadiusInMeters - 15); // Zoom aproxima (muda raio para 45m, 30m, 15m)
            updateRadar();
        });

        document.getElementById('zoom-out-btn').addEventListener('click', () => {
            radarRadiusInMeters = Math.min(150, radarRadiusInMeters + 15); // Zoom afasta (expande raio em metros)
            updateRadar();
        });

        document.getElementById('collect-btn').addEventListener('click', () => {
            if (!selectedObjectId) {
                alert("Selecione um ponto laranja no visor primeiro!");
                return;
            }

            const currentObj = objectsList.find(obj => obj.id === selectedObjectId);
            if (!currentObj || !currentPosition) return;

            const distance = calculateDistance(currentPosition.lat, currentPosition.lng, currentObj.lat, currentObj.lng);
            
            if (distance <= 3) {
                alert(`Parabéns! Você conseguiu coletar o objeto: "${currentObj.name}"!`);
                objectsList = objectsList.filter(obj => obj.id !== selectedObjectId);
                localStorage.setItem('radar_objects', JSON.stringify(objectsList));
                selectedObjectId = null;
                updateRadar();
            } else {
                alert(`Fora de alcance! Você está a ${distance.toFixed(1)}m de distância. Chegue a menos de 3 metros.`);
            }
        });

        SCREEN.addEventListener('touchstart', startPress, { passive: false });
        SCREEN.addEventListener('touchend', cancelPress, { passive: false });
        SCREEN.addEventListener('touchmove', cancelPress, { passive: false });
        SCREEN.addEventListener('mousedown', startPress);
        SCREEN.addEventListener('mouseup', cancelPress);
        SCREEN.addEventListener('mouseleave', cancelPress);

        initSensors();
    </script>
</body>
</html>
