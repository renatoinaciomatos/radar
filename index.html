<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar de Objetos Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Desativa seleção de texto e menus nativos ao segurar a tela no celular */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Estrutura Externa do Radar */
        .radar-case {
            width: 320px;
            height: 360px;
            background: radial-gradient(circle at 50% 30%, #f0f0f0 0%, #c0c0c0 70%, #8c8c8c 100%);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 -10px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 40px;
        }

        /* Botão Superior do Dispositivo */
        .radar-top-button {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 30px;
            background: linear-gradient(to right, #666, #999, #666);
            border-radius: 5px 5px 0 0;
            border-bottom: 4px solid #444;
        }

        /* Tela do Radar */
        .radar-screen {
            width: 260px;
            height: 260px;
            background-color: #224422;
            border: 12px solid #a0a0a0;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.3);
            /* Evita gestos padrão do navegador nesta área */
            touch-action: none; 
        }

        /* Linhas de Grade */
        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
            pointer-events: none;
        }

        /* Varredura Circular */
        .sweep {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: conic-gradient(from 0deg, rgba(0,255,0,0.15) 0deg, transparent 90deg);
            animation: rotate-sweep 4s linear infinite;
            pointer-events: none;
            transform-origin: center;
        }

        @keyframes rotate-sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Marcador Central */
        .center-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: #00ff00;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #00ff00;
            z-index: 10;
        }

        #points-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Objetos (Esferas Laranjas) */
        .object-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #fff 0%, #ff8800 40%, #ff3300 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ff5500, 0 0 4px #ffaa00;
        }

        .object-dot.selected {
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 8px #ff5500;
        }

        /* Painel Inferior de Controle */
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(to bottom, #444, #222);
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Ajuste específico para os botões de escala */
        .zoom-btn {
            font-size: 20px;
            padding: 8px 24px;
        }

        #collect-btn {
            background: linear-gradient(to bottom, #d9534f, #c9302c);
            border-color: #ac2925;
            text-transform: uppercase;
            font-size: 14px;
        }

        .info-panel {
            color: #88ff88;
            font-family: monospace;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            max-width: 300px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="radar-case">
        <div class="radar-top-button"></div>
        <div class="radar-screen" id="radar-screen">
            <div class="grid-lines"></div>
            <div class="sweep"></div>
            <div class="center-marker"></div>
            <div id="points-container"></div>
        </div>
    </div>

    <div class="controls">
        <button id="zoom-in-btn" class="zoom-btn">+</button>
        <button id="zoom-out-btn" class="zoom-btn">-</button>
        <button id="collect-btn">Coletar</button>
    </div>

    <div class="info-panel" id="info-panel">
        Aguardando sinal de GPS...
    </div>
    <script>
        let currentPosition = null;
        let objectsList = JSON.parse(localStorage.getItem('radar_objects')) || [];
        let zoomLevel = 0.0005; 
        let selectedObjectId = null;

        let pressTimer = null;
        let isLongPressTriggered = false;

        const SCREEN = document.getElementById('radar-screen');
        const CONTAINER = document.getElementById('points-container');
        const INFO = document.getElementById('info-panel');

        function initGeolocation() {
            if (!navigator.geolocation) {
                INFO.innerText = "Erro: Seu navegador não suporta Geolocalização.";
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    updateRadar();
                },
                (error) => {
                    INFO.innerText = "Erro ao acessar GPS. Ative a localização nas configurações do celular.";
                    console.error(error);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
            );
        }

        function updateRadar() {
            CONTAINER.innerHTML = '';
            if (!currentPosition) return;

            INFO.innerText = `GPS OK\nPressione e segure a tela verde por 1 segundo para marcar um objeto.`;

            const screenWidth = SCREEN.clientWidth;
            const screenHeight = SCREEN.clientHeight;
            const centerX = screenWidth / 2;
            const centerY = screenHeight / 2;

            objectsList.forEach(obj => {
                const deltaLat = obj.lat - currentPosition.lat;
                const deltaLng = obj.lng - currentPosition.lng;

                const posX = centerX + (deltaLng / zoomLevel) * centerX;
                const posY = centerY - (deltaLat / zoomLevel) * centerY;

                const distFromCenter = Math.sqrt(Math.pow(posX - centerX, 2) + Math.pow(posY - centerY, 2));
                
                if (distFromCenter < (centerX - 10)) {
                    const dot = document.createElement('div');
                    dot.className = 'object-dot';
                    if (selectedObjectId === obj.id) dot.classList.add('selected');
                    
                    dot.style.left = `${posX}px`;
                    dot.style.top = `${posY}px`;
                    
                    // Tratamento de clique simples em smartphones
                    dot.addEventListener('touchend', (e) => {
                        e.stopPropagation();
                        selectObject(obj);
                    });
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectObject(obj);
                    });

                    CONTAINER.appendChild(dot);
                }
            });
        }

        function selectObject(obj) {
            selectedObjectId = obj.id;
            const distance = calculateDistance(currentPosition.lat, currentPosition.lng, obj.lat, obj.lng);
            INFO.innerText = `Alvo: ${obj.name}\nDistância: ${distance.toFixed(1)}m de você.`;
            updateRadar();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Sistema unificado de Toque Longo compatível com Mobile
        function startPress(e) {
            if (!currentPosition) return;
            
            // Impede zoom ou ações nativas do navegador mobile durante o toque
            if (e.cancelable) e.preventDefault(); 
            
            isLongPressTriggered = false;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const rect = SCREEN.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            pressTimer = setTimeout(() => {
                isLongPressTriggered = true;
                handleLongPress(clickX, clickY);
            }, 900); // 900 milissegundos segurando para ativar
        }

        function cancelPress(e) {
            if (pressTimer) clearTimeout(pressTimer);
            // Se foi um toque rápido (não ativou o long press), remove seleções prévias
            if (!isLongPressTriggered && e.type === 'touchend') {
                // Permite limpar o foco se clicar no vazio da tela
            }
        }

        function handleLongPress(x, y) {
            const screenWidth = SCREEN.clientWidth;
            const screenHeight = SCREEN.clientHeight;
            const centerX = screenWidth / 2;
            const centerY = screenHeight / 2;

            const deltaLng = ((x - centerX) / centerX) * zoomLevel;
            const deltaLat = ((centerY - y) / centerY) * zoomLevel;

            const targetLat = currentPosition.lat + deltaLat;
            const targetLng = currentPosition.lng + deltaLng;

            // Abre o prompt para nomear o objeto
            setTimeout(() => {
                const objectName = prompt("Insira o nome do objeto encontrado:");
                if (objectName && objectName.trim() !== "") {
                    const newObject = {
                        id: Date.now(),
                        name: objectName.trim(),
                        lat: targetLat,
                        lng: targetLng
                    };
                    objectsList.push(newObject);
                    localStorage.setItem('radar_objects', JSON.stringify(objectsList));
                    updateRadar();
                }
            }, 50);
        }

        // Controles dos botões de escala modificados (+ e -)
        document.getElementById('zoom-in-btn').addEventListener('click', () => {
            zoomLevel = Math.max(0.00005, zoomLevel / 1.5);
            updateRadar();
        });

        document.getElementById('zoom-out-btn').addEventListener('click', () => {
            zoomLevel = Math.min(0.005, zoomLevel * 1.5);
            updateRadar();
        });

        document.getElementById('collect-btn').addEventListener('click', () => {
            if (!selectedObjectId) {
                alert("Selecione um ponto laranja no radar primeiro!");
                return;
            }

            const currentObj = objectsList.find(obj => obj.id === selectedObjectId);
            if (!currentObj || !currentPosition) return;

            const distance = calculateDistance(currentPosition.lat, currentPosition.lng, currentObj.lat, currentObj.lng);

            if (distance <= 3) {
                alert(`Sucesso! Você coletou o objeto: "${currentObj.name}"`);
                objectsList = objectsList.filter(obj => obj.id !== selectedObjectId);
                localStorage.setItem('radar_objects', JSON.stringify(objectsList));
                selectedObjectId = null;
                updateRadar();
            } else {
                alert(`Muito longe! Você está a ${distance.toFixed(1)}m. Aproxime-se a menos de 3m.`);
            }
        });

        // Eventos para Mobile (Toque)
        SCREEN.addEventListener('touchstart', startPress, { passive: false });
        SCREEN.addEventListener('touchend', cancelPress, { passive: false });
        SCREEN.addEventListener('touchmove', cancelPress, { passive: false });

        // Fallback para Desktop (Mouse)
        SCREEN.addEventListener('mousedown', startPress);
        SCREEN.addEventListener('mouseup', cancelPress);
        SCREEN.addEventListener('mouseleave', cancelPress);

        initGeolocation();
    </script>
</body>
</html>
